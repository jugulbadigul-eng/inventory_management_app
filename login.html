<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — InventoryFlow</title>
    <meta name="description" content="Sign in to InventoryFlow to manage your inventory.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }

        /* ── LEFT PANEL ── */
        .left-panel {
            width: 50%;
            background: linear-gradient(145deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative orbs */
        .left-panel::before {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%);
            top: -100px; right: -100px;
            border-radius: 50%;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(167,139,250,0.2) 0%, transparent 70%);
            bottom: -80px; left: -80px;
            border-radius: 50%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            z-index: 1;
            letter-spacing: -0.02em;
        }

        .brand-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }

        .left-content {
            z-index: 1;
            color: rgba(255,255,255,0.85);
        }

        .left-content h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        .left-content p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.6);
        }

        .left-footer {
            z-index: 1;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.35);
        }

        /* ── RIGHT PANEL ── */
        .right-panel {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            background: #fff;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        /* ── FORM ── */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 7px;
        }

        .form-group label span { color: #ef4444; }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-group input::placeholder { color: #94a3b8; }

        .form-group input:focus {
            border-color: #6366f1;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #374151;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .forgot-password {
            font-size: 0.85rem;
            font-weight: 500;
            color: #6366f1;
            text-decoration: none;
        }

        .forgot-password:hover { text-decoration: underline; }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 16px;
            padding: 10px 14px;
            background: #fef2f2;
            border-radius: 8px;
            border-left: 3px solid #ef4444;
            display: none;
        }

        .login-btn {
            width: 100%;
            padding: 13px 24px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(99,102,241,0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .register-text {
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
        }

        .register-text a {
            color: #6366f1;
            font-weight: 600;
            text-decoration: none;
        }

        .register-text a:hover { text-decoration: underline; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; min-height: 200px; padding: 30px; }
            .left-content h2 { font-size: 1.4rem; }
            .right-panel { width: 100%; padding: 40px 24px; }
        }
    </style>
</head>
<body>

    <!-- Left Brand Panel -->
    <div class="left-panel">
        <div class="brand">
            <div class="brand-icon">◆</div>
            InventoryFlow
        </div>

        <div class="left-footer">© 2026 InventoryFlow. All rights reserved.</div>
    </div>

    <!-- Right Login Panel -->
    <div class="right-panel">
        <div class="login-container">
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to your account to continue.</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginIdentifier">Email or Username <span>*</span></label>
                    <input type="text" id="loginIdentifier" placeholder="Enter your email or username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password <span>*</span></label>
                    <input type="password" id="password" placeholder="Minimum 8 characters" required autocomplete="current-password">
                </div>

                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <div id="errorMsg" class="error-msg" role="alert"></div>

                <button type="submit" id="loginBtn" class="login-btn">Login</button>
            </form>

            <p class="register-text">Not registered yet? <a href="register.html">Create an account</a></p>
        </div>
    </div>

    <script src="./auth.js"></script>
</body>
</html>
