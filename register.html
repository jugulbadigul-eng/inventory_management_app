<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — InventoryFlow</title>
    <meta name="description" content="Create your InventoryFlow account to start managing your inventory.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }

        /* ── LEFT PANEL ── */
        .left-panel {
            width: 45%;
            background: linear-gradient(145deg, #1e1b4b 0%, #312e81 60%, #1e1b4b 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, transparent 65%);
            top: -120px; right: -120px;
            border-radius: 50%;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(167,139,250,0.18) 0%, transparent 65%);
            bottom: -60px; left: -60px;
            border-radius: 50%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            z-index: 1;
            letter-spacing: -0.02em;
        }

        .brand-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }

        .left-content {
            z-index: 1;
        }

        .left-content h2 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.25;
            letter-spacing: -0.03em;
        }

        .left-content p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.55);
        }

        .left-footer {
            z-index: 1;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
        }

        /* ── RIGHT PANEL ── */
        .right-panel {
            width: 55%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 48px;
            background: #fff;
            overflow-y: auto;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
        }

        .register-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* ── FORM ── */
        .form-group {
            margin-bottom: 16px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .two-col .form-group { margin-bottom: 0; }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 7px;
        }

        .form-group label span { color: #ef4444; }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-group input::placeholder { color: #94a3b8; }

        .form-group input:focus {
            border-color: #6366f1;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0 24px;
        }

        .terms input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #6366f1;
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .terms label {
            font-size: 0.85rem;
            color: #64748b;
            cursor: pointer;
            line-height: 1.5;
        }

        .terms a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }

        .terms a:hover { text-decoration: underline; }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: #fef2f2;
            border-radius: 8px;
            border-left: 3px solid #ef4444;
            display: none;
        }

        .success-msg {
            color: #059669;
            font-size: 0.85rem;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: #ecfdf5;
            border-radius: 8px;
            border-left: 3px solid #10b981;
            display: none;
        }

        .signup-btn {
            width: 100%;
            padding: 13px 24px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
            margin-bottom: 20px;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(99,102,241,0.4);
        }

        .signup-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
        }

        .login-link a {
            color: #6366f1;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover { text-decoration: underline; }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; min-height: 180px; padding: 30px; }
            .left-content h2 { font-size: 1.3rem; }
            .right-panel { width: 100%; padding: 40px 24px; }
            .two-col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Left Brand Panel -->
    <div class="left-panel">
        <div class="brand">
            <div class="brand-icon">◆</div>
            InventoryFlow
        </div>

        <div class="left-footer">© 2026 InventoryFlow. All rights reserved.</div>
    </div>

    <!-- Right Register Panel -->
    <div class="right-panel">
        <div class="register-container">
            <h1>Create your account</h1>
            <p class="subtitle">Fill in the details below to get started.</p>

            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="username">Username <span>*</span></label>
                    <input type="text" id="username" placeholder="Choose a username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email (optional)" autocomplete="email">
                </div>

                <div class="two-col">
                    <div class="form-group">
                        <label for="password">Password <span>*</span></label>
                        <input type="password" id="password" placeholder="Min. 8 characters" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span>*</span></label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
                    </div>
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to the <a href="#">Terms of Service</a>, <a href="#">Privacy Policy</a>, and <a href="#">Fees</a></label>
                </div>

                <div id="errorMsg" class="error-msg" role="alert"></div>
                <div id="successMsg" class="success-msg" role="status"></div>

                <button type="submit" id="signupBtn" class="signup-btn">Create Account</button>

                <p class="login-link">Already have an account? <a href="login.html">Sign in</a></p>
            </form>
        </div>
    </div>

    <script src="./auth.js"></script>
</body>
</html>
